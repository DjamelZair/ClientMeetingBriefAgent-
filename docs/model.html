<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How the models perform</title>
<meta name="description" content="How the take up models, the client groups and the fairness audit behind the client meeting brief perform, all read from data.json.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Gelasio:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="field.css">
<style>
/* the model page has no novelty strip, so the two fields take the whole first screen */
:root{--strip-h:0px;--lg:var(--petrol);--lr:var(--ink-soft)}
.code{font-family:var(--mono);font-size:.86em}

/* ---------- left field ---------- */
.field{padding:22px 32px 22px 48px}
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:9px;margin-top:14px;color:var(--on);text-decoration:none;font-size:14px;font-weight:600;
  border:1px solid var(--on-soft);border-radius:2px;padding:7px 12px;transition:background-color .2s ease,color .2s ease}
.back::before{content:"";width:7px;height:7px;border-left:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg)}
.back:hover{background:var(--on);color:var(--petrol)}
.field .group{font-size:44px;margin-top:22px}
.field .desc{font-size:14px;max-width:44ch;margin-top:12px;line-height:1.4}
.split{margin-top:18px}
.months{display:flex;gap:3px}
.mends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--on-faint);margin:4px 0 8px}
.months i{flex:1;height:14px;border:1px solid var(--petrol-line)}
.months .m-train{background:var(--on-soft);border-color:var(--on-soft)}
.months .m-val{background:transparent;border:2px solid var(--on)}
.months .m-test{background:var(--on);border-color:var(--on)}
.months .m-brief{border:1px dashed var(--on-faint)}
.split dl{display:grid;grid-template-columns:16px 82px 1fr;column-gap:8px;font-size:13px}
.split dt,.split dd{padding:4px 0;border-top:1px solid var(--petrol-line)}
.split dt.k{display:flex;align-items:center}
.split dt.k i{width:12px;height:12px;display:block}
.split dt.n{font-weight:600}
.split dd{color:var(--on-soft)}
.split dd b{color:var(--on);font-weight:600}
.field .facts{margin-top:16px}
.field .facts li{font-size:13.5px;font-weight:400;color:var(--on-soft);padding:5px 0}
.field .facts li b{display:block;font-size:20px;font-weight:700;color:var(--on);letter-spacing:-0.01em;line-height:1.1}
.field .facts li.warn b{color:var(--verm-on)}
.src{margin-top:auto;padding-top:14px;font-size:12px;color:var(--on-faint);line-height:1.35}

/* ---------- tabs ---------- */
.paper{display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:28px;padding:0 40px;border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:thin;flex:none}
.tab{background:none;border:0;cursor:pointer;padding:20px 0 13px;font-size:14.5px;font-weight:600;color:var(--ink-soft);white-space:nowrap;
  box-shadow:inset 0 -2px 0 transparent;transition:color .2s ease,box-shadow .2s ease}
.tab span{font-weight:400;margin-right:6px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.tab:focus-visible{outline-offset:-2px}
#panels{flex:1;min-height:0;display:flex;flex-direction:column}
.panel{padding:20px 40px 20px;flex:1;min-height:0;overflow:auto}
.panel[hidden]{display:none}
.panel.in{animation:fadein .28s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.panel h2{font-size:26px;font-weight:700;letter-spacing:-0.02em;line-height:1.1}
.lead{font-family:var(--serif);font-size:14.5px;line-height:1.45;color:var(--ink-soft);margin-top:8px;max-width:96ch;text-wrap:pretty}
.lead b{color:var(--ink);font-weight:500}
.lead .flag{color:var(--verm-ink);font-weight:500}
.key{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:12px;color:var(--ink-soft);margin-top:14px}
.key span{display:inline-flex;align-items:center;gap:6px}
.key svg{width:22px;height:12px;overflow:visible}
.blk{margin-top:14px}
.blk h3{font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:4px}
.cap{font-size:12px;color:var(--ink-soft);margin-top:4px}
svg.chart{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:var(--sans);fill:var(--ink-soft);font-size:11px}
svg .lab{fill:var(--ink);font-size:12.5px}
svg .grid{stroke:var(--rule);stroke-width:1}
svg .axis{stroke:var(--ink-soft);stroke-width:1}
.wrapx{overflow-x:auto;max-width:100%;position:relative}

/* compact tables: rules, not boxes */
.t{border-collapse:collapse;font-size:12.5px;width:100%;font-variant-numeric:tabular-nums lining-nums}
.t th{font-weight:600;color:var(--ink-soft);text-align:right;padding:4px 8px;border-bottom:1.5px solid var(--ink);vertical-align:bottom;font-size:12px}
.t td{text-align:right;padding:3px 8px;border-bottom:1px solid var(--rule);white-space:nowrap;vertical-align:top}
.t th:first-child,.t td:first-child{text-align:left;padding-left:0}
.t td.l,.t th.l{text-align:left}
.t .v{color:var(--verm-ink);font-weight:600}
.t .muted{color:var(--ink-soft)}
.t tr.sum td{border-bottom:0}

/* evaluation */
.t.ev td,.t.ev th{padding-left:6px;padding-right:6px}
.t.ev td:first-child,.t.ev th:first-child{padding-left:0}

/* calibration */
.cal{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 22px;margin-top:10px}
.cal h3{font-size:13px;font-weight:600;color:var(--ink)}
.cal h3 span{font-weight:400;color:var(--ink-soft)}

/* tuning */
.none{font-size:22px;font-weight:600;letter-spacing:-0.01em;margin-top:18px;max-width:44ch;line-height:1.2}
.two{display:grid;grid-template-columns:minmax(0,0.9fr) minmax(0,1.1fr);gap:40px;margin-top:16px;align-items:start}
.params{display:grid;grid-template-columns:auto 1fr;column-gap:24px;font-size:13.5px}
.params dt,.params dd{padding:5px 0;border-bottom:1px solid var(--rule)}
.params dt{font-family:var(--mono);font-size:12px;color:var(--ink-soft);padding-top:7px}
.params dd{font-weight:600;font-variant-numeric:tabular-nums}
.trials{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 22px;margin-top:8px}
.trials h3{font-size:12.5px;font-weight:600;color:var(--ink)}
.trials h3 span{font-weight:400;color:var(--ink-soft)}
.fixed{font-size:12px;color:var(--ink-soft);margin-top:6px}
.t th.wr{white-space:normal;max-width:84px;line-height:1.2}
.tune td,.tune th{padding-left:6px;padding-right:6px}

/* segmentation */
.seg{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:40px;margin-top:12px;align-items:start}
.sizes{list-style:none}
.sizes li{display:grid;grid-template-columns:1fr auto;column-gap:10px;padding:6px 0 7px;border-top:1px solid var(--rule);font-size:13.5px}
.sizes li b{font-weight:600}
.sizes li span{color:var(--ink-soft);font-variant-numeric:tabular-nums;font-size:12.5px}
.sizes .bar{grid-column:1 / -1;height:7px;margin-top:5px;position:relative}
.sizes .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--petrol);transform-origin:left;}
.ari{display:flex;align-items:baseline;gap:12px;margin-top:16px;padding-top:10px;border-top:1.5px solid var(--ink)}
.ari b{font-size:34px;font-weight:700;letter-spacing:-0.03em;line-height:1}
.ari span{font-size:13px;color:var(--ink-soft);max-width:40ch}

/* fairness */
.fr{font-size:12px}
.fr td,.fr th{padding:1px 6px}
.t.fr td.l{padding-left:6px}
.fr th:first-child{padding-left:0}
.fr td.flags{white-space:normal;text-align:left;color:var(--verm-ink);font-weight:500;min-width:250px;line-height:1.25;padding-top:2px}
.fr td.flags span{display:block}
.fr td.att{color:var(--ink-soft);white-space:normal;max-width:84px;padding-left:0}
.fr tr.first td{border-top:1px solid var(--ink-soft)}
.heat{font-size:11.5px;table-layout:fixed}
.heat th{font-size:10.5px;font-weight:500;text-align:center;white-space:normal;line-height:1.15;padding:3px 2px;border-bottom:1px solid var(--ink)}
.heat th.att{font-size:11px;font-weight:600;color:var(--ink);border-bottom:1px solid var(--rule);text-align:left;padding-left:4px}
.heat th:first-child{width:112px;text-align:left}
.heat td{text-align:center;padding:1px 1px;line-height:1.3;border-bottom:2px solid var(--paper);border-right:2px solid var(--paper);color:var(--ink)}
.heat td:first-child{text-align:left;color:var(--ink);font-size:12px;padding-left:0}
.heat td.all{font-weight:600}
.heat td.fl{color:var(--verm-ink);font-weight:700;box-shadow:inset 0 0 0 1.5px var(--verm)}
.heat td.na{color:var(--ink-soft)}
.seg-btns{display:inline-flex;gap:0;margin-left:10px;vertical-align:1px}
.seg-btns button{background:transparent;border:1px solid var(--ink-soft);padding:1px 9px;font-size:12px;cursor:pointer;color:var(--ink-soft)}
.seg-btns button + button{border-left:0}
.seg-btns button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.blk h3.row{display:flex;align-items:center;flex-wrap:wrap;gap:6px}

/* limits */
.limits{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:22px 44px;margin-top:20px;counter-reset:lim}
.limits li{border-top:1.5px solid var(--ink);padding-top:10px;counter-increment:lim}
.limits h3{font-size:18px;font-weight:600;letter-spacing:-0.01em;line-height:1.2}
.limits h3::before{content:counter(lim);font-weight:400;color:var(--ink-soft);margin-right:10px}
.limits p{font-family:var(--serif);font-size:14.5px;line-height:1.45;color:var(--ink-soft);margin-top:6px;max-width:58ch}

/* ---------- smaller screens ---------- */
@media (max-width:999px){
  .field{padding:18px 18px 22px}
  .field .group{font-size:36px}
  .tabs{padding:0 18px;gap:22px}
  .panel{padding:18px 18px 26px;overflow:visible}
  .cal,.trials{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two,.seg,.limits{grid-template-columns:minmax(0,1fr)}
  svg.chart.wide{min-width:760px}
  .t.heat{min-width:860px}.t.fr{min-width:820px}.t.ev,.t.tune{min-width:760px}
}
</style>
</head>
<body>
<div class="page" data-fold-end>
  <aside class="field" id="side" aria-label="What is modelled"></aside>
  <main class="paper" id="main">
    <div class="tabs" role="tablist" aria-label="Model sections" id="tabs"></div>
    <div id="panels"></div>
  </main>
</div>
<footer id="foot"></footer>
<script src="field.js"></script>
<script>
(function(){
"use strict";
/* the one place to change where "back to the brief" goes */
var BRIEF_URL = "brief/";

var esc = Field.esc, SVGNS = 'xmlns="http://www.w3.org/2000/svg"';
var MINUS = "−";
function f3(v){ return v == null ? "" : (v < 0 ? MINUS : "") + Math.abs(v).toFixed(3); }
function f4(v){ return v == null ? "" : Number(v).toFixed(4); }
function s3(v){ return (v < 0 ? MINUS : "+") + Math.abs(v).toFixed(3); }
function pct(v, d){ return (v * 100).toFixed(d == null ? 1 : d) + "%"; }
function int(v){ return Math.round(v).toLocaleString("en-GB"); }
function num(v){ return typeof v === "number" ? (Number.isInteger(v) ? int(v) : String(+v.toPrecision(4))) : esc(String(v)); }
function rx(d, r){ return Math.round(d * r) / r; }

/* nice ticks for a small domain */
function ticks(lo, hi, n){
  var raw = (hi - lo) / (n || 4), mag = Math.pow(10, Math.floor(Math.log10(raw))), st = [1, 2, 2.5, 5, 10].map(function(m){ return m * mag; })
    .find(function(s){ return s >= raw; });
  var out = [], t = Math.ceil(lo / st - 1e-9) * st;
  for (; t <= hi + 1e-9; t += st) out.push(+t.toFixed(6));
  return out;
}
function scale(d0, d1, r0, r1){ return function(v){ return r0 + (v - d0) / (d1 - d0) * (r1 - r0); }; }

/* ---------- the left field ---------- */
function sideHTML(D, F){
  var mo = D.meta.months, df = D.data_facts, M = D.propensity.metrics, fa = D.model_card.fairness, tu = D.model_card.tuning;
  /* every month from the first in the data to the brief month, coloured by what it is used for */
  var all = [], y = +df.first_month.slice(0, 4), m = +df.first_month.slice(5, 7), last = mo.brief_target;
  for (var g = 0; g < 60; g++){ var s = y + "-" + (m < 10 ? "0" : "") + m; all.push(s); if (s === last) break; m++; if (m > 12){ m = 1; y++; } }
  var cls = function(s){ return mo.train_targets.indexOf(s) >= 0 ? "m-train" : s === mo.val_target ? "m-val" : s === mo.test_target ? "m-test" : s === mo.brief_target ? "m-brief" : ""; };
  var roc = M.map(function(r){ return r.lgbm_roc_auc; }), pr = M.map(function(r){ return r.lgbm_pr_auc; });
  var nt = mo.train_targets.length;
  return '<p class="lock"><b>Djamel Zair</b>, application for Junior Data Scientist, CLUE</p>' +
    '<a class="back" href="' + esc(BRIEF_URL) + '">Back to the brief</a>' +
    '<h1 class="group">How the models perform</h1>' +
    '<p class="desc">One take up model per product: will a client who does not hold it yet have it next month. ' +
      'LightGBM against a logistic regression baseline, for ' + df.n_products_modelled + ' of ' + df.n_products_raw + ' products, on ' +
      int(df.sample_clients) + ' sampled clients. Then k means client groups and a fairness audit of the brief.</p>' +
    '<div class="split"><div class="months" aria-hidden="true">' + all.map(function(s){ return '<i class="' + cls(s) + '" title="' + s + '"></i>'; }).join("") + '</div>' +
      '<p class="mends" aria-hidden="true"><span>' + all[0] + '</span><span>' + (all.length - 1) + ' months of data, then the brief month</span><span>' + all[all.length - 1] + '</span></p>' +
      '<dl>' +
      '<dt class="k"><i style="background:var(--on-soft)"></i></dt><dt class="n">Train</dt>' +
        '<dd><b>' + mo.train_targets[0] + ' to ' + mo.train_targets[nt - 1] + '</b>, ' + nt + ' target months, ' + int(df.train_rows) + ' rows</dd>' +
      '<dt class="k"><i style="border:2px solid var(--on)"></i></dt><dt class="n">Validation</dt>' +
        '<dd><b>' + mo.val_target + '</b>, ' + int(df.val_rows) + ' rows, early stopping</dd>' +
      '<dt class="k"><i style="background:var(--on)"></i></dt><dt class="n">Test</dt>' +
        '<dd><b>' + mo.test_target + '</b>, ' + int(df.test_rows) + ' rows, never seen in training</dd>' +
      '<dt class="k"><i style="border:1px dashed var(--on-faint)"></i></dt><dt class="n">Brief</dt>' +
        '<dd><b>' + mo.brief_target + '</b>, scored for the meetings, no labels</dd>' +
      '</dl></div>' +
    '<ul class="facts">' +
      '<li><b>' + f3(Math.min.apply(null, roc)) + ' to ' + f3(Math.max.apply(null, roc)) + '</b>ROC AUC, LightGBM, test month</li>' +
      '<li><b>' + f3(Math.min.apply(null, pr)) + ' to ' + f3(Math.max.apply(null, pr)) + '</b>PR AUC, LightGBM, test month</li>' +
      '<li><b>' + df.n_model_features + ' features</b>without ' + df.excluded_features.map(function(x){ return '<span class="code">' + esc(x) + '</span>'; }).join(" or ") + '</li>' +
      '<li><b>' + D.segmentation.k + ' client groups</b>k means, k from ' + D.segmentation.k_range[0] + ' to ' + D.segmentation.k_range[1] + '</li>' +
      '<li class="warn"><b>' + fa.n_flags + ' fairness flags</b>on suggestion rates and ranking quality, all shown under Fairness</li>' +
      '<li' + (tu.run ? '' : ' class="warn"') + '><b>' + (tu.run ? esc(tu.method) : 'No tuning yet') + '</b>' +
        (tu.run ? 'hyperparameter search, ' + tu.n_trials + ' trials' : 'no search run, the same fixed parameters for every product') + '</li>' +
    '</ul>' +
    '<p class="src">' + esc(D.meta.source) + ', ' + df.first_month + ' to ' + df.last_month + ', ' + int(df.raw_rows) + ' rows of ' +
      int(df.raw_clients) + ' clients. Seed ' + D.meta.seed + '.</p>';
}

/* ---------- 1. evaluation ---------- */
function dotKey(){
  return '<div class="key">' +
    '<span><svg ' + SVGNS + ' viewBox="0 0 22 12"><line x1="1" x2="21" y1="6" y2="6" stroke="var(--lg)" stroke-width="1.5"/><circle cx="11" cy="6" r="4" fill="var(--lg)"/></svg>LightGBM, with its 95% interval</span>' +
    '<span><svg ' + SVGNS + ' viewBox="0 0 22 12"><line x1="1" x2="21" y1="6" y2="6" stroke="var(--lr)" stroke-width="1.5"/><circle cx="11" cy="6" r="3.6" fill="var(--paper)" stroke="var(--lr)" stroke-width="1.5"/></svg>Logistic regression baseline</span>' +
    '<span><svg ' + SVGNS + ' viewBox="0 0 22 12"><line x1="1" x2="21" y1="6" y2="6" stroke="var(--verm)" stroke-width="1.5"/><rect x="7.5" y="2.5" width="7" height="7" fill="var(--verm)"/></svg>Lift interval includes zero</span>' +
    '<span>Intervals from a paired bootstrap of the test month</span></div>';
}

function evalChart(M, F){
  var W = 900, LW = 122, GAP = 30, FW = (W - LW - GAP * 2) / 3, RH = 25, TOP = 40, H = TOP + M.length * RH + 4;
  var minOf = function(keys){ return Math.min.apply(null, M.map(function(r){ return Math.min.apply(null, keys.map(function(k){ return r[k]; })); })); };
  var maxOf = function(keys){ return Math.max.apply(null, M.map(function(r){ return Math.max.apply(null, keys.map(function(k){ return r[k]; })); })); };
  var facets = [
    {title: "ROC AUC", lo: Math.floor(minOf(["lgbm_roc_auc_lo", "logreg_roc_auc_lo"]) * 50) / 50, hi: 1, pair: "roc_auc"},
    {title: "PR AUC", lo: 0, hi: Math.ceil(maxOf(["lgbm_pr_auc_hi", "logreg_pr_auc_hi"]) * 10) / 10, pair: "pr_auc"},
    {title: "PR AUC lift, LightGBM minus baseline", lo: Math.min(0, Math.floor(minOf(["lift_pr_auc_lo"]) * 20) / 20), hi: Math.ceil(maxOf(["lift_pr_auc_hi"]) * 20) / 20, lift: "pr_auc"}
  ];
  var s = '<svg class="chart wide" ' + SVGNS + ' viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="ROC AUC, PR AUC and PR AUC lift per product with 95% intervals">';
  facets.forEach(function(fc, i){
    var x0 = LW + i * (FW + GAP), x = scale(fc.lo, fc.hi, x0, x0 + FW);
    s += '<text x="' + x0 + '" y="12" class="lab" style="font-weight:600;font-size:12.5px">' + fc.title + '</text>';
    ticks(fc.lo, fc.hi, 4).forEach(function(t){
      s += '<line class="grid" x1="' + x(t) + '" x2="' + x(t) + '" y1="' + (TOP - 6) + '" y2="' + (H - 2) + '"' + (fc.lift && t === 0 ? ' style="stroke:var(--ink);stroke-width:1.2"' : '') + '/>' +
           '<text x="' + x(t) + '" y="' + (TOP - 10) + '" text-anchor="middle">' + (fc.lift && t > 0 ? "+" : "") + (t < 0 ? MINUS + Math.abs(t) : t) + '</text>';
    });
    M.forEach(function(r, j){
      var yc = TOP + j * RH + RH / 2;
      if (fc.pair){
        var k = fc.pair, yl = yc + 4, yg = yc - 4;
        s += '<line x1="' + x(r["logreg_" + k + "_lo"]) + '" x2="' + x(r["logreg_" + k + "_hi"]) + '" y1="' + yl + '" y2="' + yl + '" stroke="var(--lr)" stroke-width="1.5"/>' +
             '<circle cx="' + x(r["logreg_" + k]) + '" cy="' + yl + '" r="3.6" fill="var(--paper)" stroke="var(--lr)" stroke-width="1.5"><title>' + esc(F.plabel(r.product)) + ' baseline ' + f3(r["logreg_" + k]) + ' (' + f3(r["logreg_" + k + "_lo"]) + ' to ' + f3(r["logreg_" + k + "_hi"]) + ')</title></circle>' +
             '<line x1="' + x(r["lgbm_" + k + "_lo"]) + '" x2="' + x(r["lgbm_" + k + "_hi"]) + '" y1="' + yg + '" y2="' + yg + '" stroke="var(--lg)" stroke-width="1.5"/>' +
             '<circle cx="' + x(r["lgbm_" + k]) + '" cy="' + yg + '" r="4" fill="var(--lg)"><title>' + esc(F.plabel(r.product)) + ' LightGBM ' + f3(r["lgbm_" + k]) + ' (' + f3(r["lgbm_" + k + "_lo"]) + ' to ' + f3(r["lgbm_" + k + "_hi"]) + ')</title></circle>';
      } else {
        var lo = r["lift_" + fc.lift + "_lo"], hi = r["lift_" + fc.lift + "_hi"], v = r["lift_" + fc.lift], z = lo <= 0;
        var c = z ? "var(--verm)" : "var(--lg)";
        s += '<line x1="' + x(lo) + '" x2="' + x(hi) + '" y1="' + yc + '" y2="' + yc + '" stroke="' + c + '" stroke-width="1.5"/>' +
             (z ? '<rect x="' + (x(v) - 3.5) + '" y="' + (yc - 3.5) + '" width="7" height="7" fill="' + c + '"/>' : '<circle cx="' + x(v) + '" cy="' + yc + '" r="4" fill="' + c + '"/>') +
             '<title>' + esc(F.plabel(r.product)) + ' PR AUC lift ' + s3(v) + ' (' + s3(lo) + ' to ' + s3(hi) + ')</title>';
      }
    });
  });
  M.forEach(function(r, j){
    s += '<text class="lab" x="0" y="' + (TOP + j * RH + RH / 2 + 4) + '">' + esc(F.plabel(r.product)) + '</text>';
    if (j) s += '<line class="grid" x1="0" x2="' + W + '" y1="' + (TOP + j * RH) + '" y2="' + (TOP + j * RH) + '" style="stroke-dasharray:1 3"/>';
  });
  return s + '</svg>';
}

function evalPanel(D, F){
  var M = D.propensity.metrics, mo = D.meta.months, n = M.length;
  var rocBetter = M.filter(function(r){ return r.lgbm_roc_auc > r.logreg_roc_auc; }).length;
  var prBetter = M.filter(function(r){ return r.lgbm_pr_auc > r.logreg_pr_auc; }).length;
  var zero = M.filter(function(r){ return r.lift_pr_auc_lo <= 0 || r.lift_roc_auc_lo <= 0; });
  var clear = M.filter(function(r){ return r.lift_pr_auc_lo > 0 && r.lift_roc_auc_lo > 0; }).length;
  var zeroText = zero.map(function(r){
    var parts = [];
    if (r.lift_pr_auc_lo <= 0) parts.push("the PR AUC lift interval runs from " + s3(r.lift_pr_auc_lo) + " to " + s3(r.lift_pr_auc_hi));
    if (r.lift_roc_auc_lo <= 0) parts.push("the ROC AUC lift interval starts at " + f3(r.lift_roc_auc_lo));
    return '<span class="flag">' + esc(F.plabel(r.product)) + '</span>, with ' + int(r.n_test_pos) + ' take ups in the test month: ' + parts.join(" and ");
  });
  /* take up is rare, which is why PR AUC is the number to watch, so the lead says so first */
  var rates = M.map(function(r){ return r.base_rate; });
  var lead = 'Take up is rare: between ' + pct(Math.min.apply(null, rates), 2) + ' and ' + pct(Math.max.apply(null, rates), 2) +
    ' of clients take up a product in a month, so PR AUC, which ignores the many easy negatives, is the stricter test. ' +
    'Scored on ' + mo.test_target + ', a month no model saw while training. LightGBM has the higher ROC AUC on ' + rocBetter + ' of ' + n +
    ' products and the higher PR AUC on ' + prBetter + ' of ' + n + '; both lift intervals stay above zero for ' + clear + ' of ' + n + '. ' +
    (zero.length ? 'The intervals include zero for ' + zeroText.join("; ") + ', so there LightGBM is not clearly better than the baseline.' : 'No lift interval includes zero.');
  var rows = M.map(function(r){
    var zp = r.lift_pr_auc_lo <= 0, zr = r.lift_roc_auc_lo <= 0;
    return '<tr><td>' + esc(F.plabel(r.product)) + '</td><td>' + int(r.n_test_pos) + '</td><td class="muted">' + int(r.n_test) + '</td><td class="muted">' + pct(r.base_rate, 2) + '</td>' +
      '<td>' + f3(r.lgbm_roc_auc) + '</td><td class="muted">' + f3(r.logreg_roc_auc) + '</td><td' + (zr ? ' class="v"' : '') + '>' + s3(r.lift_roc_auc) + ' <span class="muted">(' + s3(r.lift_roc_auc_lo) + ' to ' + s3(r.lift_roc_auc_hi) + ')</span>' + (zr ? ' includes 0' : '') + '</td>' +
      '<td>' + f3(r.lgbm_pr_auc) + '</td><td class="muted">' + f3(r.logreg_pr_auc) + '</td><td' + (zp ? ' class="v"' : '') + '>' + s3(r.lift_pr_auc) + ' <span class="muted">(' + s3(r.lift_pr_auc_lo) + ' to ' + s3(r.lift_pr_auc_hi) + ')</span>' + (zp ? ' includes 0' : '') + '</td></tr>';
  }).join("");
  return '<h2>LightGBM against the baseline</h2><p class="lead">' + lead + '</p>' + dotKey() +
    '<div class="blk wrapx">' + evalChart(M, F) + '</div>' +
    '<div class="blk wrapx"><table class="t ev"><thead><tr><th>Product</th><th>Take ups</th><th>Clients</th><th>Base rate</th>' +
    '<th>ROC AUC</th><th>Baseline</th><th>ROC lift (95%)</th><th>PR AUC</th><th>Baseline</th><th>PR lift (95%)</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}

/* ---------- 2. calibration ---------- */
function calChart(pts, product, F){
  var W = 200, H = 140, L = 34, R = 194, T = 8, B = 124;
  var mx = Math.max.apply(null, pts.map(function(p){ return Math.max(p.mean_pred, p.observed); }));
  var stops = [0.01, 0.02, 0.05, 0.1, 0.2, 0.3, 0.5, 0.75, 1], top = stops.find(function(s){ return s >= mx; }) || 1;
  /* square root axes: most bins sit near zero and one bin carries most of the take up */
  var sx = function(v){ return L + Math.sqrt(v / top) * (R - L); }, sy = function(v){ return B - Math.sqrt(v / top) * (B - T); };
  var tk = [0].concat([0.005, 0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1].filter(function(t){ return t <= top && t >= top / 30; }));
  if (tk[tk.length - 1] !== top) tk.push(top);
  /* drop ticks that would sit on top of each other near zero */
  tk = tk.filter(function(t, i){ return i === 0 || i === tk.length - 1 ? true : sx(t) - sx(tk[i - 1]) >= 20 && sx(top) - sx(t) >= 20; });
  var lbl = function(t){ return t === 0 ? "0" : (t * 100 < 1 ? (t * 100).toFixed(1) : Math.round(t * 100)) + "%"; };
  var s = '<svg class="chart" ' + SVGNS + ' viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Reliability of ' + esc(F.plabel(product)) + ' scores">';
  tk.forEach(function(t){
    s += '<line class="grid" x1="' + sx(t) + '" x2="' + sx(t) + '" y1="' + T + '" y2="' + B + '"/><line class="grid" x1="' + L + '" x2="' + R + '" y1="' + sy(t) + '" y2="' + sy(t) + '"/>' +
         '<text x="' + sx(t) + '" y="' + (B + 13) + '" text-anchor="middle" style="font-size:10px">' + lbl(t) + '</text>' +
         '<text x="' + (L - 4) + '" y="' + (sy(t) + 3.5) + '" text-anchor="end" style="font-size:10px">' + lbl(t) + '</text>';
  });
  s += '<line x1="' + sx(0) + '" y1="' + sy(0) + '" x2="' + sx(top) + '" y2="' + sy(top) + '" stroke="var(--ink-soft)" stroke-width="1" stroke-dasharray="3 3"/>';
  s += '<polyline fill="none" stroke="var(--lg)" stroke-width="1.5" points="' + pts.map(function(p){ return sx(p.mean_pred).toFixed(1) + "," + sy(p.observed).toFixed(1); }).join(" ") + '"/>';
  pts.forEach(function(p){
    s += '<circle cx="' + sx(p.mean_pred).toFixed(1) + '" cy="' + sy(p.observed).toFixed(1) + '" r="2.8" fill="var(--lg)"><title>bin ' + p.bin + ': predicted ' + pct(p.mean_pred, 2) + ', observed ' + pct(p.observed, 2) + ', ' + int(p.n) + ' clients</title></circle>';
  });
  return s + '</svg>';
}

function calPanel(D, F){
  var M = D.propensity.metrics, Q = D.propensity.calibration.quantile, n = M.length;
  var byP = function(p){ return Q.filter(function(q){ return q.model === "lgbm" && q.product === p; }).sort(function(a, b){ return a.bin - b.bin; }); };
  var over = M.filter(function(r){ var b = byP(r.product); var t = b[b.length - 1]; return t && t.mean_pred > t.observed; });
  var dBrier = Math.max.apply(null, M.map(function(r){ return Math.abs(r.lgbm_isotonic_brier - r.lgbm_brier); }));
  var isoPr = M.filter(function(r){ return r.lgbm_isotonic_pr_auc < r.lgbm_pr_auc; }).length;
  var beatLr = M.filter(function(r){ return r.lgbm_brier < r.logreg_brier; }).length;
  var bins = byP(M[0].product).length;
  var lead = 'Each dot is one of ' + bins + ' equal sized bins of the ' + D.meta.months.test_target + ' scores; on the dashed diagonal the predicted take up is what happened. ' +
    'In the top bin LightGBM predicts more take up than it sees for ' + over.length + ' of ' + n + ' products; the brief quotes the observed take up of a score band, never the raw score. ' +
    'Isotonic calibration on the validation month was tried and rejected: it moves the Brier score by at most ' + f4(dBrier) + ' and lowers PR AUC on ' + isoPr + ' of ' + n + ' products.';
  var grid = M.map(function(r){
    return '<div><h3>' + esc(F.plabel(r.product)) + ' <span>Brier ' + f4(r.lgbm_brier) + '</span></h3>' + calChart(byP(r.product), r.product, F) + '</div>';
  }).join("");
  var row = function(name, key, cls){
    return '<tr' + (cls ? ' class="' + cls + '"' : '') + '><td class="l">' + name + '</td>' + M.map(function(r){ return '<td>' + f4(r[key]) + '</td>'; }).join("") + '</tr>';
  };
  return '<h2>Calibration</h2><p class="lead">' + lead + '</p>' +
    '<div class="cal">' + grid + '</div><p class="cap">Across: predicted take up. Up: observed take up. Both axes on a square root scale so the low bins stay readable.</p>' +
    '<div class="blk wrapx"><h3>Brier score per product, test month (lower is better; LightGBM is lower than the baseline on ' + beatLr + ' of ' + n + ')</h3>' +
    '<table class="t"><thead><tr><th class="l">Model</th>' + M.map(function(r){ return '<th>' + esc(F.plabel(r.product)) + '</th>'; }).join("") + '</tr></thead><tbody>' +
    row("LightGBM, used", "lgbm_brier") + row("Logistic regression baseline", "logreg_brier") +
    '<tr class="sum"><td class="l muted">LightGBM with isotonic, <span class="code">lgbm_isotonic</span>, rejected</td>' + M.map(function(r){ return '<td class="muted">' + f4(r.lgbm_isotonic_brier) + '</td>'; }).join("") + '</tr>' +
    '</tbody></table></div>';
}

/* ---------- 3. tuning ---------- */
function itersChart(M, ceiling, F){
  var W = 470, LW = 118, RH = 24, TOP = 22, H = TOP + M.length * RH + 6, x = scale(0, ceiling, LW, W - 14);
  var s = '<svg class="chart" ' + SVGNS + ' viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Boosting rounds kept per product">';
  ticks(0, ceiling, 4).forEach(function(t){
    s += '<line class="grid" x1="' + x(t) + '" x2="' + x(t) + '" y1="' + (TOP - 4) + '" y2="' + H + '"/><text x="' + x(t) + '" y="' + (TOP - 8) + '" text-anchor="middle">' + int(t) + '</text>';
  });
  M.forEach(function(r, j){
    var yc = TOP + j * RH + RH / 2;
    s += '<text class="lab" x="0" y="' + (yc + 4) + '">' + esc(F.plabel(r.product)) + '</text>' +
         '<rect x="' + LW + '" y="' + (yc - 4) + '" width="' + (x(r.lgbm_best_iteration) - LW) + '" height="8" fill="var(--lg)"/>' +
         '<text x="' + (x(r.lgbm_best_iteration) + 6) + '" y="' + (yc + 4) + '" style="fill:var(--ink)">' + int(r.lgbm_best_iteration) + '</text>';
  });
  return s + '</svg>';
}

function trialsChart(list, info, F, product){
  var W = 200, H = 112, L = 36, R = 194, T = 8, B = 92;
  var vals = list.map(function(t){ return t.val_pr_auc; }), lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals), pad = (hi - lo) * 0.12 || 0.005;
  lo -= pad; hi += pad;
  var nT = list.length, sx = scale(0, Math.max(1, nT - 1), L, R), sy = scale(lo, hi, B, T);
  var best = info.best_trial, s = '<svg class="chart" ' + SVGNS + ' viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Validation PR AUC per trial for ' + esc(F.plabel(product)) + '">';
  ticks(lo, hi, 3).forEach(function(t){
    s += '<line class="grid" x1="' + L + '" x2="' + R + '" y1="' + sy(t) + '" y2="' + sy(t) + '"/><text x="' + (L - 4) + '" y="' + (sy(t) + 3.5) + '" text-anchor="end" style="font-size:10px">' + t.toFixed(3) + '</text>';
  });
  s += '<line class="grid" x1="' + L + '" x2="' + R + '" y1="' + sy(info.val_pr_auc_default) + '" y2="' + sy(info.val_pr_auc_default) + '" style="stroke:var(--ink-soft);stroke-dasharray:2 3"/>';
  list.forEach(function(t, i){
    var cx = sx(i).toFixed(1), cy = sy(t.val_pr_auc).toFixed(1), tip = '<title>trial ' + t.trial + ': ' + f4(t.val_pr_auc) + '</title>';
    if (t.trial === 0) s += '<circle cx="' + cx + '" cy="' + cy + '" r="4.5" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.5">' + tip + '</circle>';
    else if (t.trial === best) s += '<rect x="' + (cx - 4.5) + '" y="' + (cy - 4.5) + '" width="9" height="9" fill="var(--ink)">' + tip + '</rect>';
    else s += '<circle cx="' + cx + '" cy="' + cy + '" r="2.4" fill="var(--petrol-line)">' + tip + '</circle>';
  });
  s += '<text x="' + L + '" y="' + (H - 4) + '" style="font-size:10px">trial 0</text><text x="' + R + '" y="' + (H - 4) + '" text-anchor="end" style="font-size:10px">trial ' + list[nT - 1].trial + '</text>';
  return s + '</svg>';
}

function tunePanel(D, F){
  var T = D.model_card.tuning, M = D.propensity.metrics, mo = D.meta.months;
  if (!T.run){
    var P = T.default_params || {}, its = M.map(function(r){ return r.lgbm_best_iteration; });
    return '<h2>Tuning</h2><p class="none">No hyperparameter search has been run yet.</p>' +
      '<p class="lead">Every product uses the same fixed LightGBM parameters below; none of them was searched. ' +
      'The only thing fitted per product is the number of boosting rounds: <span class="code">n_estimators</span> is a ceiling of ' + int(P.n_estimators) +
      ', and early stopping on the validation month (' + mo.val_target + ') kept between ' + int(Math.min.apply(null, its)) + ' and ' + int(Math.max.apply(null, its)) + ' rounds. ' +
      'The test month (' + mo.test_target + ') played no part in any of these choices.</p>' +
      '<div class="two"><div class="blk"><h3>Current fixed parameters</h3><dl class="params">' +
      Object.keys(P).map(function(k){ return '<dt>' + esc(k) + '</dt><dd>' + num(P[k]) + '</dd>'; }).join("") + '</dl></div>' +
      '<div class="blk"><h3>Boosting rounds kept by early stopping, out of ' + int(P.n_estimators) + '</h3>' + itersChart(M, P.n_estimators, F) + '</div></div>';
  }
  var prods = M.map(function(r){ return r.product; }).filter(function(p){ return T.products && T.products[p]; });
  var tuned = prods.filter(function(p){ return T.products[p].chosen === "tuned"; });
  var gains = prods.map(function(p){ var x = T.products[p]; return x.val_pr_auc_best - x.val_pr_auc_default; });
  var searched = T.searched || [];
  var lead = esc(T.method) + ' search, ' + T.n_trials + ' trials per product with seed ' + T.seed + ', maximising ' + esc(T.objective) + ' on the validation month (' + esc(T.validation_month) +
    ') with ' + int(T.train_rows_per_trial) + ' training rows per trial; trial 0 is the default. ' +
    'Validation PR AUC gains over the default run from ' + s3(Math.min.apply(null, gains)) + ' to ' + s3(Math.max.apply(null, gains)) + '. ' +
    'The tuned parameters are kept for ' + tuned.length + ' of ' + prods.length + ' products; the others stay on the default, and the test month played no part in the choice.';
  var key = '<div class="key"><span><svg ' + SVGNS + ' viewBox="0 0 22 12"><circle cx="11" cy="6" r="4.5" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.5"/></svg>Default, trial 0 (dashed line)</span>' +
    '<span><svg ' + SVGNS + ' viewBox="0 0 22 12"><rect x="6.5" y="1.5" width="9" height="9" fill="var(--ink)"/></svg>Best trial</span>' +
    '<span><svg ' + SVGNS + ' viewBox="0 0 22 12"><circle cx="11" cy="6" r="2.4" fill="var(--petrol-line)"/></svg>Other trials, in trial order</span></div>';
  var grid = prods.map(function(p){
    var list = ((T.trials || {})[p] || []).slice().sort(function(a, b){ return a.trial - b.trial; });
    return '<div><h3>' + esc(F.plabel(p)) + ' <span>' + (T.products[p].chosen === "tuned" ? "tuned" : "default kept") + '</span></h3>' + (list.length ? trialsChart(list, T.products[p], F, p) : '<p class="cap">No trials logged.</p>') + '</div>';
  }).join("");
  var rows = prods.map(function(p){
    var x = T.products[p], g = x.val_pr_auc_best - x.val_pr_auc_default, pr = x.params || {};
    return '<tr><td>' + esc(F.plabel(p)) + '</td><td>' + x.n_trials + '</td><td class="muted">' + f4(x.val_pr_auc_default) + '</td><td>' + f4(x.val_pr_auc_best) + ' <span class="muted">(trial ' + x.best_trial + ')</span></td>' +
      '<td>' + s3(g) + '</td><td class="l">' + (x.chosen === "tuned" ? "tuned" : "default") + '</td>' +
      searched.map(function(k){ return '<td' + (x.chosen === "tuned" ? '' : ' class="muted"') + '>' + (pr[k] == null ? "" : num(pr[k])) + '</td>'; }).join("") +
      '<td class="muted">' + Math.round(x.seconds) + ' s</td></tr>';
  }).join("");
  var fixed = T.fixed || {};
  return '<h2>Tuning</h2><p class="lead">' + lead + '</p>' + key +
    '<div class="trials">' + grid + '</div>' +
    '<div class="blk wrapx"><table class="t tune"><thead><tr><th>Product</th><th>Trials</th><th>Default</th><th>Best</th><th>Gain</th><th class="l">Kept</th>' +
    searched.map(function(k){ return '<th class="wr"><span class="code">' + esc(k).replace(/_/g, "_<wbr>") + '</span></th>'; }).join("") + '<th>Time</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '<p class="fixed">Validation PR AUC. Parameters shown are the best trial’s. Held fixed: ' + Object.keys(fixed).map(function(k){ return '<span class="code">' + esc(k) + '</span> ' + num(fixed[k]); }).join(", ") + '.</p></div>';
}

/* ---------- 4. segmentation ---------- */
function segChart(S){
  var ks = Object.keys(S.silhouette).map(Number).sort(function(a, b){ return a - b; });
  var W = 480, L = 58, R = 466, H1T = 26, H1B = 140, H2T = 186, H2B = 300, H = 330;
  var x = scale(ks[0], ks[ks.length - 1], L, R);
  var sv = ks.map(function(k){ return S.silhouette[k]; }), iv = ks.map(function(k){ return S.inertia[k]; });
  var best = Math.max.apply(null, sv), slo = Math.floor((Math.min.apply(null, sv) - 0.01) * 50) / 50, shi = Math.ceil((best + 0.005) * 50) / 50;
  var ys = scale(slo, shi, H1B, H1T), ilo = 0, ihi = Math.ceil(Math.max.apply(null, iv) / 100000) * 100000, yi = scale(ilo, ihi, H2B, H2T);
  var s = '<svg class="chart" ' + SVGNS + ' viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Silhouette and inertia for k from ' + ks[0] + ' to ' + ks[ks.length - 1] + '">';
  s += '<text x="0" y="12" class="lab" style="font-weight:600">Silhouette, higher is better</text>' +
       '<text x="0" y="' + (H2T - 18) + '" class="lab" style="font-weight:600">Inertia, the elbow is where gains flatten</text>';
  /* the tie band: every k within tie_margin of the best silhouette counts as tied */
  s += '<rect x="' + L + '" width="' + (R - L) + '" y="' + ys(best) + '" height="' + (ys(best - S.tie_margin) - ys(best)) + '" fill="var(--band)" opacity=".6"/>' +
       '<text x="' + (L + 4) + '" y="' + (ys(best - S.tie_margin) - 3) + '" style="font-size:10px">within ' + S.tie_margin + ' of the best</text>';
  ticks(slo, shi, 3).forEach(function(t){ s += '<line class="grid" x1="' + L + '" x2="' + R + '" y1="' + ys(t) + '" y2="' + ys(t) + '"/><text x="' + (L - 6) + '" y="' + (ys(t) + 3.5) + '" text-anchor="end">' + t.toFixed(2) + '</text>'; });
  ticks(ilo, ihi, 3).forEach(function(t){ s += '<line class="grid" x1="' + L + '" x2="' + R + '" y1="' + yi(t) + '" y2="' + yi(t) + '"/><text x="' + (L - 6) + '" y="' + (yi(t) + 3.5) + '" text-anchor="end">' + (t ? Math.round(t / 1000) + 'k' : '0') + '</text>'; });
  /* chosen k across both facets, elbow on the inertia facet */
  s += '<line x1="' + x(S.k) + '" x2="' + x(S.k) + '" y1="' + (H1T - 6) + '" y2="' + H2B + '" stroke="var(--ink)" stroke-width="1.5"/>' +
       '<text x="' + (x(S.k) + 5) + '" y="' + (H1T - 2) + '" style="fill:var(--ink);font-weight:600">chosen k ' + S.k + '</text>' +
       '<line x1="' + x(S.elbow_k) + '" x2="' + x(S.elbow_k) + '" y1="' + (H2T - 4) + '" y2="' + H2B + '" stroke="var(--ink-soft)" stroke-width="1.2" stroke-dasharray="3 3"/>' +
       '<text x="' + (x(S.elbow_k) + 5) + '" y="' + (H2T + 6) + '">elbow k ' + S.elbow_k + '</text>';
  var line = function(vals, y){ return '<polyline fill="none" stroke="var(--lg)" stroke-width="1.5" points="' + ks.map(function(k, i){ return x(k).toFixed(1) + "," + y(vals[i]).toFixed(1); }).join(" ") + '"/>'; };
  s += line(sv, ys) + line(iv, yi);
  ks.forEach(function(k, i){
    var on = k === S.k;
    s += '<circle cx="' + x(k) + '" cy="' + ys(sv[i]) + '" r="' + (on ? 4.5 : 3) + '" fill="' + (on ? "var(--ink)" : "var(--lg)") + '"><title>k ' + k + ': silhouette ' + f3(sv[i]) + '</title></circle>' +
         '<circle cx="' + x(k) + '" cy="' + yi(iv[i]) + '" r="' + (on ? 4.5 : 3) + '" fill="' + (on ? "var(--ink)" : "var(--lg)") + '"><title>k ' + k + ': inertia ' + int(iv[i]) + '</title></circle>' +
         '<text x="' + x(k) + '" y="' + (H2B + 16) + '" text-anchor="middle">' + k + '</text>' +
         '';
  });
  return s + '<text x="' + R + '" y="' + (H - 2) + '" text-anchor="end">k</text></svg>';
}

function segPanel(D, F){
  var S = D.segmentation, ks = Object.keys(S.silhouette).map(Number);
  var best = Math.max.apply(null, ks.map(function(k){ return S.silhouette[k]; })), bestK = ks.find(function(k){ return S.silhouette[k] === best; });
  var tied = ks.filter(function(k){ return S.silhouette[k] >= best - S.tie_margin; }).sort(function(a, b){ return a - b; });
  var lead = 'k means on standardised client features, without ' + D.data_facts.excluded_features.map(function(x){ return '<span class="code">' + esc(x) + '</span>'; }).join(" or ") + '. ' +
    'Silhouette decides: k ' + bestK + ' scores highest (' + f3(best) + ') and every k within ' + S.tie_margin + ' of it counts as tied (' + tied.map(function(k){ return "k " + k; }).join(", ") + '); ' +
    (tied.length > 1 ? 'the tie goes to the k nearest the elbow of the inertia curve (k ' + S.elbow_k + '), so k ' + S.k + '.' : 'so k ' + S.k + '.') +
    ' A Gaussian mixture with the same k mostly finds the same groups.';
  var mx = Math.max.apply(null, S.clusters.map(function(c){ return c.share; }));
  var sizes = S.clusters.map(function(c){
    return '<li><b>' + esc(c.name) + '</b><span>' + int(c.size) + ', ' + pct(c.share, 1) + '</span><span class="bar"><i style="right:' + (100 - c.share / mx * 100).toFixed(2) + '%"></i></span></li>';
  }).join("");
  var total = S.clusters.reduce(function(a, c){ return a + c.size; }, 0);
  return '<h2>Client groups</h2><p class="lead">' + lead + '</p>' +
    '<div class="seg"><div class="blk">' + segChart(S) + '</div>' +
    '<div class="blk"><h3>Group sizes, ' + int(total) + ' clients</h3><ul class="sizes">' + sizes + '</ul>' +
    '<div class="ari"><b>' + f3(S.ari_gmm) + '</b><span>adjusted Rand index between k means and a Gaussian mixture with k ' + S.k + ' (1 is the same partition, 0 is chance)</span></div></div></div>';
}

/* ---------- 5. fairness ---------- */
function fairPanel(D, F, metric){
  var Fa = D.model_card.fairness, M = D.propensity.metrics, lo = Fa.rate_ratio[0], hi = Fa.rate_ratio[1];
  var atts = [], groups = [];
  Fa.rates.forEach(function(r){ if (atts.indexOf(r.attribute) < 0) atts.push(r.attribute); });
  var out = function(v){ return v < lo || v > hi; };
  var rows = "";
  atts.forEach(function(a){
    var rs = Fa.rates.filter(function(r){ return r.attribute === a; });
    rs.forEach(function(r, i){
      groups.push(r);
      rows += '<tr' + (i === 0 ? ' class="first"' : '') + '>' + (i === 0 ? '<td class="att" rowspan="' + rs.length + '">' + esc(r.attribute_words) + '</td>' : '') +
        '<td class="l">' + esc(r.group) + '</td><td>' + int(r.n_clients) + '</td>' +
        '<td>' + pct(r.suggestion_rate, 1) + '</td><td' + (out(r.suggestion_ratio) ? ' class="v"' : '') + '>' + r.suggestion_ratio.toFixed(2) + '</td>' +
        '<td>' + pct(r.held_back_rate, 2) + '</td><td' + (out(r.held_back_ratio) ? ' class="v"' : '') + '>' + r.held_back_ratio.toFixed(2) + '</td>' +
        '<td class="flags">' + (r.flags.length ? r.flags.map(function(f){ return '<span>' + esc(f) + '</span>'; }).join("") : '<span class="muted" style="color:var(--ink-soft);font-weight:400">none</span>') + '</td></tr>';
    });
  });
  var rateFlags = Fa.rates.reduce(function(a, r){ return a + r.flags.length; }, 0), aucFlags = Fa.auc.filter(function(x){ return x.flag; });
  var ov = Fa.overall;
  var lead = 'A group is flagged when its suggestion or held back rate is below ' + lo + ' or above ' + hi + ' times the overall (' + pct(ov.suggestion_rate, 1) + ', ' + pct(ov.held_back_rate, 2) +
    '), or its ROC AUC for a product is more than ' + Fa.auc_gap + ' below that product’s overall. ' +
    'Sex is excluded from the features and only used to audit; it is coded as recorded (H, V) and the coding is undocumented. ' +
    'All <span class="flag">' + Fa.n_flags + ' flags</span> are shown as computed: ' + rateFlags + ' on rates, ' + aucFlags.length + ' on ranking quality.';
  /* heat table: products down, groups across, cells shaded by value */
  var key = metric === "pr" ? "pr_auc" : "roc_auc", vals = Fa.auc.filter(function(x){ return x[key] != null; }).map(function(x){ return x[key]; });
  M.forEach(function(r){ vals.push(r["lgbm_" + key]); });
  var vlo = Math.min.apply(null, vals), vhi = Math.max.apply(null, vals);
  var shade = function(v){ var t = (v - vlo) / (vhi - vlo || 1); return "oklch(" + (97 - t * 17).toFixed(1) + "% " + (0.006 + t * 0.05).toFixed(3) + " 195)"; };
  var head1 = '<tr><th rowspan="2" style="vertical-align:bottom">Product</th><th rowspan="2" style="vertical-align:bottom">All</th>' +
    atts.map(function(a){ var n = groups.filter(function(g){ return g.attribute === a; }).length; return '<th class="att" colspan="' + n + '">' + esc(groups.find(function(g){ return g.attribute === a; }).attribute_words) + '</th>'; }).join("") + '</tr>';
  var head2 = '<tr>' + groups.map(function(g){ return '<th>' + esc(g.group) + '</th>'; }).join("") + '</tr>';
  var body = M.map(function(r){
    return '<tr><td>' + esc(F.plabel(r.product)) + '</td><td class="all" style="background:' + shade(r["lgbm_" + key]) + '">' + r["lgbm_" + key].toFixed(2) + '</td>' +
      groups.map(function(g){
        var c = Fa.auc.find(function(x){ return x.product === r.product && x.attribute === g.attribute && x.group === g.group; });
        if (!c || c[key] == null) return '<td class="na" title="' + (c ? int(c.positives) + ' take ups, fewer than ' + Fa.min_positives : 'not measured') + '"><span class="sr">blank</span></td>';
        var fl = key === "roc_auc" && c.flag;
        return '<td' + (fl ? ' class="fl"' : '') + ' style="background:' + shade(c[key]) + '" title="' + esc(c.flag || (int(c.positives) + ' take ups, ' + f3(c[key]))) + '">' + c[key].toFixed(2) + '</td>';
      }).join("") + '</tr>';
  }).join("");
  var blanks = Fa.auc.filter(function(x){ return x.roc_auc == null; }).length;
  return '<h2>Fairness and ethics</h2><p class="lead" style="max-width:none">' + lead + '</p>' +
    '<div class="blk wrapx"><table class="t fr"><thead><tr><th class="l">Audit attribute</th><th class="l">Group</th><th>Briefed clients</th><th>Suggested</th><th>× overall</th><th>Held back</th><th>× overall</th><th class="l">Flags</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<div class="blk wrapx"><h3 class="row">Ranking quality, test month' +
      '<span class="seg-btns" role="group" aria-label="Metric"><button type="button" data-m="roc" aria-pressed="' + (key === "roc_auc") + '">ROC AUC</button><button type="button" data-m="pr" aria-pressed="' + (key === "pr_auc") + '">PR AUC</button></span>' +
      '<span style="font-weight:400">' + (key === "roc_auc" ? 'Outlined in vermilion: ' + aucFlags.length + ' flags, more than ' + Fa.auc_gap + ' below All.' : 'Follows each group’s base rate, so no flags here.') + ' Blank (' + blanks + ' cells): fewer than ' + Fa.min_positives + ' take ups.</span></h3>' +
    '<table class="t heat"><thead>' + head1 + head2 + '</thead><tbody>' + body + '</tbody></table></div>';
}

/* ---------- 6. limits ---------- */
function limitsPanel(D){
  var L = (D.model_card.limits || []).slice(0, 5);
  return '<h2>Limits</h2><p class="lead">What these numbers cannot tell you, from the model card.</p>' +
    '<ol class="limits">' + L.map(function(l){ return '<li><h3>' + esc(l.title) + '</h3><p>' + esc(l.text) + '</p></li>'; }).join("") + '</ol>';
}

/* ---------- tabs ---------- */
var TABS = [
  {id: "evaluation", name: "Evaluation"}, {id: "calibration", name: "Calibration"}, {id: "tuning", name: "Tuning"},
  {id: "segmentation", name: "Segmentation"}, {id: "fairness", name: "Fairness and ethics"}, {id: "limits", name: "Limits"}
];

function render(F){
  var D = F.data, fairMetric = "roc";
  document.getElementById("side").innerHTML = sideHTML(D, F);
  var tabs = document.getElementById("tabs"), panels = document.getElementById("panels");
  tabs.innerHTML = TABS.map(function(t, i){
    return '<button type="button" role="tab" class="tab" id="tab-' + t.id + '" aria-controls="p-' + t.id + '" aria-selected="false" tabindex="-1"><span>' + (i + 1) + '</span>' + t.name + '</button>';
  }).join("");
  var build = {
    evaluation: function(){ return evalPanel(D, F); }, calibration: function(){ return calPanel(D, F); }, tuning: function(){ return tunePanel(D, F); },
    segmentation: function(){ return segPanel(D, F); }, fairness: function(){ return fairPanel(D, F, fairMetric); }, limits: function(){ return limitsPanel(D); }
  };
  panels.innerHTML = TABS.map(function(t){
    return '<section class="panel" role="tabpanel" id="p-' + t.id + '" aria-labelledby="tab-' + t.id + '" tabindex="0" hidden>' + build[t.id]() + '</section>';
  }).join("");
  /* the metric switch on the fairness panel redraws only that panel */
  panels.addEventListener("click", function(e){
    var b = e.target.closest("[data-m]"); if (!b) return;
    fairMetric = b.getAttribute("data-m");
    var p = document.getElementById("p-fairness"); p.innerHTML = build.fairness();
    var nb = p.querySelector('[data-m="' + fairMetric + '"]'); if (nb) nb.focus();
  });
  var btns = Array.prototype.slice.call(tabs.querySelectorAll('[role="tab"]'));
  function select(i, focus, animate){
    btns.forEach(function(b, j){
      var on = j === i; b.setAttribute("aria-selected", String(on)); b.tabIndex = on ? 0 : -1;
      var p = document.getElementById(b.getAttribute("aria-controls")); p.hidden = !on;
      p.classList.toggle("in", on && animate !== false);
    });
    if (focus){ btns[i].focus(); btns[i].scrollIntoView({block: "nearest", inline: "nearest"}); }
    try { history.replaceState(null, "", "#" + TABS[i].id); } catch (e) {}
  }
  btns.forEach(function(b, i){
    b.addEventListener("click", function(){ select(i, false); });
    b.addEventListener("keydown", function(e){
      var n = btns.length, k = e.key, j = k === "ArrowRight" ? (i + 1) % n : k === "ArrowLeft" ? (i - 1 + n) % n : k === "Home" ? 0 : k === "End" ? n - 1 : -1;
      if (j < 0) return; e.preventDefault(); select(j, true);
    });
  });
  var start = TABS.findIndex(function(t){ return "#" + t.id === location.hash; });
  select(start < 0 ? 0 : start, false, false);
  window.__model = {select: select, count: TABS.length};
  /* the shared footer links to this page; here it should lead back to the brief instead */
  var self = document.querySelector('#foot a[href="' + F.links.model + '"]');
  if (self){ self.href = BRIEF_URL; self.textContent = "Back to the brief"; }
}

Field.boot({onReady: render});
})();
</script>
